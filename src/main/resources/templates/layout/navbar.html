<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header class="site-header" th:fragment="navbar(activePage)">
    <div class="container">
        <nav class="navbar">
            <a th:href="${#authorization.expression('isAuthenticated()')} ? @{/dashboard} : @{/}" class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                <span>MediCare</span>
            </a>

            <ul class="nav-menu">
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/dashboard}" class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        Dashboard
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/records}" class="nav-link" th:classappend="${activePage == 'records'} ? 'active'">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        Records
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/appointments}" class="nav-link" th:classappend="${activePage == 'appointments'} ? 'active'">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        Appointments
                    </a>
                </li>
                <li sec:authorize="isAuthenticated()">
                    <a th:href="@{/profile}" class="nav-link" th:classappend="${activePage == 'profile'} ? 'active'">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Profile
                    </a>
                </li>
                <li sec:authorize="!isAuthenticated()">
                    <a th:href="@{/#features}" class="nav-link">Features</a>
                </li>
                <li sec:authorize="!isAuthenticated()">
                    <a th:href="@{/contact}" class="nav-link" th:classappend="${activePage == 'contact'} ? 'active'">Contact</a>
                </li>
            </ul>

            <div class="nav-user-controls">
                <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 0.75rem;">
                    <a th:href="@{/profile}" class="user-badge">
                        <span class="avatar-initial" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                        <span th:text="${#authentication.name}">Username</span>
                    </a>
                    <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                        <button type="submit" class="btn btn-sm btn-light" title="Log Out" style="cursor: pointer; display: flex; align-items: center; gap: 0.35rem;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            Logout
                        </button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()" style="display: flex; align-items: center; gap: 0.75rem;">
                    <a th:href="@{/login}" class="btn btn-sm btn-outline">Log in</a>
                    <a th:href="@{/register}" class="btn btn-sm btn-primary">Create Account</a>
                </div>
            </div>
        </nav>
    </div>
</header>
</body>
</html>
