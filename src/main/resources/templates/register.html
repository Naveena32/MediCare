<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — MediCare Health Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar('register')}"></div>
    <div th:replace="~{layout/base :: alerts}"></div>

    <main class="app-main">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                        </svg>
                    </div>
                    <h1 class="auth-title">Create Account</h1>
                    <p class="auth-subtitle">Join MediCare to manage your health records in one safe place.</p>
                </div>

                <form th:action="@{/register}" th:object="${registerDto}" method="post" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            th:field="*{fullName}" 
                            class="form-control" 
                            placeholder="e.g. John Doe" 
                            required 
                            autofocus
                        />
                        <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            th:field="*{username}" 
                            class="form-control" 
                            placeholder="Choose a unique username" 
                            required 
                            autocomplete="username" 
                        />
                        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            th:field="*{email}" 
                            class="form-control" 
                            placeholder="you@example.com" 
                            required 
                            autocomplete="email" 
                        />
                        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            th:field="*{password}" 
                            class="form-control" 
                            placeholder="At least 6 characters" 
                            required 
                            autocomplete="new-password" 
                        />
                        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            th:field="*{confirmPassword}" 
                            class="form-control" 
                            placeholder="Re-enter your password" 
                            required 
                            autocomplete="new-password" 
                        />
                        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
                        Create Free Account
                    </button>
                </form>

                <div class="auth-footer-text">
                    Already have an account? 
                    <a th:href="@{/login}">Log in here</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
