<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Record — MediCare</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar('records')}"></div>
    <div th:replace="~{layout/base :: alerts}"></div>

    <main class="app-main">
        <div class="auth-wrapper">
            <div class="auth-card" style="border-top: 4px solid var(--danger);">
                <div class="auth-header">
                    <div class="auth-logo" style="background: var(--danger-light); color: var(--danger);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </div>
                    <h1 class="auth-title">Delete Record?</h1>
                    <p class="auth-subtitle">Are you sure you want to permanently delete this medical record?</p>
                </div>

                <div style="background: var(--surface-subtle); border-radius: var(--radius-md); padding: 1.25rem; margin-bottom: 1.75rem; border: 1px solid var(--border);">
                    <strong style="color: var(--dark-900); font-size: 1.1rem; display: block; margin-bottom: 0.25rem;" th:text="${record.title}">Record Title</strong>
                    <span class="badge badge-primary" th:text="${record.category}">Category</span>
                    <span style="font-size: 0.85rem; color: var(--muted); margin-left: 0.5rem;" th:text="'Uploaded: ' + ${#temporals.format(record.uploadedAt, 'MMM dd, yyyy')}">Uploaded: Date</span>
                </div>

                <form th:action="@{/records/{id}/delete(id=${record.id})}" method="post">
                    <div style="display: flex; gap: 1rem;">
                        <button type="submit" class="btn btn-danger btn-lg" style="flex: 1;">
                            Yes, Delete Record
                        </button>
                        <a th:href="@{/records/{id}(id=${record.id})}" class="btn btn-light btn-lg" style="flex: 1;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
