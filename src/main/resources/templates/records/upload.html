<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Medical Record — MediCare</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/records.css}">
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar('records')}"></div>
    <div th:replace="~{layout/base :: alerts}"></div>

    <main class="app-main">
        <div class="page-header">
            <div class="container">
                <div class="page-header-content">
                    <div>
                        <h1 class="page-title">Upload Health Record</h1>
                        <p class="page-subtitle">Save a new lab test, doctor note, prescription, or scan to your vault.</p>
                    </div>
                    <div>
                        <a th:href="@{/records}" class="btn btn-light">
                            &larr; Back to Records
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="card form-container-card">
                <form th:action="@{/records/upload}" th:object="${recordDto}" method="post" enctype="multipart/form-data" novalidate>
                    <div class="form-group">
                        <label for="title">Record Title *</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. Annual Blood Panel, Chest X-Ray" required>
                        <small class="form-help">e.g., Annual Blood Count, COVID-19 PCR Test, Chest X-Ray</small>
                        <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="category">Category *</label>
                            <select id="category" th:field="*{category}" class="form-select">
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Lab Result</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="recordDate">Date of Test/Visit</label>
                            <input type="date" id="recordDate" th:field="*{recordDate}" class="form-control">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="doctorName">Attending Doctor / Clinic</label>
                        <input type="text" id="doctorName" th:field="*{doctorName}" class="form-control" placeholder="e.g. Dr. Sarah Jenkins">
                    </div>

                    <div class="form-group">
                        <label for="file">Attach Document / Image (Optional)</label>
                        <input type="file" id="file" th:field="*{file}" class="form-control" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                        <small class="form-help">Upload PDF, JPG, PNG, or DOC files (Max 20MB)</small>
                    </div>

                    <div class="form-group">
                        <label for="notes">Clinical Notes &amp; Findings</label>
                        <textarea id="notes" th:field="*{notes}" class="form-control" rows="4" placeholder="Add any physician notes, findings, or follow-up actions..."></textarea>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                        <button type="submit" class="btn btn-primary btn-lg" style="flex: 2;">
                            Save Record to Vault
                        </button>
                        <a th:href="@{/records}" class="btn btn-light btn-lg" style="flex: 1;">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
