<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — MediCare</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar('profile')}"></div>
    <div th:replace="~{layout/base :: alerts}"></div>

    <main class="app-main">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 class="auth-title">Update Password</h1>
                    <p class="auth-subtitle">Choose a new secure password for your account.</p>
                </div>

                <form th:action="@{/password-change}" th:object="${passwordDto}" method="post" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="oldPassword">Current Password</label>
                        <input type="password" id="oldPassword" th:field="*{oldPassword}" class="form-control" required autocomplete="current-password">
                        <div class="field-error" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" required autocomplete="new-password">
                        <small class="form-help">Must be at least 6 characters long.</small>
                        <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" required autocomplete="new-password">
                        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" style="color: var(--danger); font-size: 0.85rem; margin-top: 0.25rem;"></div>
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">Save New Password</button>
                        <a th:href="@{/profile}" class="btn btn-light">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
