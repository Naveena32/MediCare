<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — MediCare Health Portal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🩺</text></svg>">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

    <div th:replace="~{layout/navbar :: navbar('login')}"></div>
    <div th:replace="~{layout/base :: alerts}"></div>

    <main class="app-main">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                        </svg>
                    </div>
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Log in to manage your health records &amp; appointments.</p>
                </div>

                <form th:action="@{/login}" method="post" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="email">Email or Username</label>
                        <input 
                            type="text" 
                            id="email" 
                            name="email" 
                            class="form-control" 
                            placeholder="name@example.com or username" 
                            required 
                            autocomplete="username"
                            autofocus
                        />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter your password" 
                            required 
                            autocomplete="current-password" 
                        />
                    </div>

                    <div class="auth-actions-row">
                        <label class="form-check">
                            <input type="checkbox" name="remember" value="true" checked>
                            <span>Keep me logged in</span>
                        </label>
                        <a th:href="@{/contact}" style="font-size: 0.88rem; color: var(--primary);">Need Help?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                        Sign In to Portal
                    </button>
                </form>

                <div class="auth-footer-text">
                    Don't have an account yet? 
                    <a th:href="@{/register}">Create free account</a>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
